id: bee425
title: BEE 425 Quest
subtitle: Microprocessor System Design, University of Washington Bothell
note: "Rebuild in progress. Lessons 1 to 8 and 11, Lab 3 and the midterm practice problems are in; Lesson 10, Labs 1 and 2, the homework, the simulators and the games are still coming."

# Tracks share one learning model. A track with "follows" must give every concept a bridge back to the track it follows.
tracks:
  - { id: m68k, title: "68000", blurb: "Motorola 68000: the course's first processor, used in EASy68K and Lab 3 (68008)." }
  - { id: z80, title: "Z80", follows: m68k, blurb: "Zilog Z80: taught second, so each topic calls back to the 68000." }

# Lecture PDFs used by the audit to check slide references and quotes. Optional: the audit skips this if the folder is missing.
slides:
  dir: "../Lecture slides"
  file: "BEE425F26Lesson{n}.pdf"
  footer: 'Microprocessor System Design\s+(\d+)'

# Handouts (Word files) whose quotes the audit checks. The id is the first word of a handout source's ref.
handouts:
  lab3: "../../lab3/BEE425 Lab Experiment 3 -Rev 6-corrected.docx"

# Cores that run executable claims (encodings and programs in concept files). Each module exports encode(asm) and run(source, expect).
oracles:
  m68k: oracles/m68k.js
  z80: oracles/z80.js

units:
  - id: course-intro
    title: Welcome to BEE 425
    lesson: "Lesson 1"
    blurb: "How the course is organised and graded, analog computers, and Moore's law."
    concepts:
      shared: [course-structure, analog-computers, moores-law]
  - id: design-process
    title: The design process
    lesson: "Lesson 1"
    blurb: "From research to bring-up: design phases, software planning, design reviews, test plans and choosing parts."
    concepts:
      shared: [design-phases, software-planning, design-review, test-plan, adc-resolution]
  - id: pcb-design
    title: Designing a PCB
    lesson: "Lesson 2"
    blurb: "From schematic to board: workflow, why layouts fail, trace resistance, planes, bypass capacitors, grounds, clock skew and testability."
    concepts:
      shared: [pcb-workflow, pcb-error-causes, trace-resistance, power-planes-bypass, ground-management, clock-skew, testability-mechanical]
  - id: clocks-and-pulses
    title: Clocks and pulses
    lesson: "Lesson 2"
    blurb: "Period and frequency, duty cycle, pulse measurements, ringing and propagation delay."
    concepts:
      shared: [time-and-frequency, duty-cycle, pulse-parameters, signal-integrity, propagation-delay]
  - id: processor-basics
    title: Microprocessors and microcontrollers
    lesson: "Lesson 3"
    blurb: "What a microprocessor is, its buses, CISC versus RISC, the blocks inside, and where the 68000 and Z80 came from."
    concepts:
      shared: [micro-vs-controller, bus-types, cisc-vs-risc, functional-blocks, system-components, processor-history]
  - id: programmers-model
    title: The programmer's model
    lesson: "Lesson 3"
    blurb: "Registers, flags and number notation on each processor, and two's complement arithmetic."
    concepts:
      shared: [programmers-model, twos-complement, signed-overflow]
      m68k: [m68k-registers, m68k-flags, m68k-notation]
      z80: [z80-registers, z80-flags, z80-notation]
  - id: assembly-intro
    title: Introduction to assembly language
    lesson: "Lesson 4"
    blurb: "Why assembly, machine code versus assembly, the layout of a line, and flow charts."
    concepts:
      shared: [why-assembly, machine-and-assembly, assembly-line-format, flowcharts]
  - id: assembly-programs
    title: First assembly programs
    lesson: "Lesson 4"
    blurb: "Machine code, directives, copying data, and two worked programs on each processor."
    concepts:
      shared: []
      m68k: [m68k-instruction-words, m68k-directives, m68k-move, m68k-zero-block, m68k-largest-value]
      z80: [z80-instruction-bytes, z80-directives, z80-load, z80-zero-block, z80-largest-value]
  - id: addressing-modes
    title: Addressing modes
    lesson: "Lesson 5"
    blurb: "How the 68000 finds its operands: the effective address, register, indirect, auto-increment, displacement, index, absolute, immediate and PC-relative modes."
    concepts:
      shared: []
      m68k: [m68k-effective-address, m68k-register-direct, m68k-indirect, m68k-post-pre, m68k-displacement-index, m68k-absolute-immediate, m68k-pc-relative]
      z80: [z80-addressing-forms]
  - id: program-control
    title: Program control, loops and subroutines
    lesson: "Lesson 5"
    blurb: "Compare and branch, signed versus unsigned, if/FOR/DO-WHILE, jumps, the stack and subroutines on both processors."
    concepts:
      shared: []
      m68k: [m68k-compare-and-flags, m68k-signed-unsigned-branches, m68k-loops-and-ifs, m68k-stack-subroutines]
      z80: [z80-jumps-and-calls, z80-loops-and-conditions, z80-stack-subroutines]
  - id: buses-and-cells
    title: Buses and memory cells
    lesson: "Lesson 6"
    blurb: "Sharing a bus, chip enable and output enable, the SRAM cell, address space and alignment."
    concepts:
      shared: [bus-contention-tristate, chip-enable-output-enable, active-low-negative-logic, sram-cell, address-space-alignment]
  - id: memory-decoding
    title: Memory decoding
    lesson: "Lessons 6-7"
    blurb: "From address lines to pages: how many chips, which address bits go where, and the logic that picks one page."
    concepts:
      shared: [address-lines, chip-organization, pages-and-offsets, page-ranges, chip-select]
      m68k: [m68k-memory-map]
      z80: [z80-memory-map]
  - id: memory-systems
    title: Memory systems and DRAM
    lesson: "Lesson 7"
    blurb: "Designing a memory system, byte lanes and endianness, the memory map, timing, SRAM versus DRAM and DRAM operation."
    concepts:
      shared: [memory-design-steps, bus-width-endianness, memory-map-decoders, memory-timing, sram-vs-dram, dram-operation, dram-read-write]
  - id: lab-3-68008
    title: "Lab 3: debugging a 68008 system"
    lesson: "Lab 3"
    blurb: "The 68008 board, reset vectors, the prefetch queue, chip selects, wait states and logic-analyzer measurements."
    concepts:
      shared: [m68008-board, reset-vector-fetch, prefetch-queue, function-codes-chip-selects, dtack-wait-states, la-measurements, decode-unknown-rom, lab-handling]
  - id: transistor-switching
    title: Diodes and transistors as switches
    lesson: "Lesson 8"
    blurb: "A practical review: diodes, the BJT as a switch, base resistors, saturation, open-collector drivers, Darlington pairs, MOSFETs and PNP circuits."
    concepts:
      shared: [diodes-led-zener, bjt-switch-model, base-resistor-design, saturation, choosing-transistor, open-collector-drivers, darlington-sziklai, mosfet-switch, pnp-high-side]
  - id: debug-tools
    title: Tools for real-time design and debugging
    lesson: "Lesson 11"
    blurb: "What makes embedded systems different, debug monitors, ROM emulators, logic analyzers, in-circuit emulators, prefetch and cache headaches, BDM and JTAG."
    concepts:
      shared: [embedded-systems-and-process, debug-monitor-rom-emulator, logic-analyzer-tool, in-circuit-emulator, trace-challenges-jtag]
