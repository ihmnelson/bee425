id: bee425
title: BEE 425 Quest
subtitle: Microprocessor System Design, University of Washington Bothell
note: Pilot build. Only the Memory decoding unit exists so far. The previous site is still at /archive/.

# Tracks share one learning model. A track with "follows" must give every concept a bridge back to the track it follows.
tracks:
  - { id: m68k, title: "68000", blurb: "Motorola 68000: the course's first processor, used in EASy68K and Lab 3 (68008)." }
  - { id: z80, title: "Z80", follows: m68k, blurb: "Zilog Z80: taught second, so each topic calls back to the 68000." }

# Lecture PDFs used by the audit to check slide references and quotes. Optional: the audit skips this if the folder is missing.
slides:
  dir: "../Lecture slides"
  file: "BEE425F26Lesson{n}.pdf"
  footer: 'Microprocessor System Design\s+(\d+)'

units:
  - id: processor-basics
    title: Microprocessors and microcontrollers
    lesson: "Lesson 3"
    blurb: "What a microprocessor is, its buses, CISC versus RISC, the blocks inside, and where the 68000 and Z80 came from."
    concepts:
      shared: [micro-vs-controller, bus-types, cisc-vs-risc, functional-blocks, system-components, processor-history]
  - id: pcb-design
    title: Designing a PCB
    lesson: "Lesson 2"
    blurb: "From schematic to board: workflow, why layouts fail, trace resistance, planes, bypass capacitors, grounds, clock skew and testability."
    concepts:
      shared: [pcb-workflow, pcb-error-causes, trace-resistance, power-planes-bypass, ground-management, clock-skew, testability-mechanical]
  - id: clocks-and-pulses
    title: Clocks and pulses
    lesson: "Lesson 2"
    blurb: "Period and frequency, duty cycle, pulse measurements, ringing and propagation delay."
    concepts:
      shared: [time-and-frequency, duty-cycle, pulse-parameters, signal-integrity, propagation-delay]
  - id: programmers-model
    title: The programmer's model
    lesson: "Lesson 3"
    blurb: "Registers, flags and number notation on each processor, and two's complement arithmetic."
    concepts:
      shared: [programmers-model, twos-complement, signed-overflow]
      m68k: [m68k-registers, m68k-flags, m68k-notation]
      z80: [z80-registers, z80-flags, z80-notation]
  - id: memory-decoding
    title: Memory decoding
    lesson: "Lessons 6-7"
    blurb: "From address lines to pages: how many chips, which address bits go where, and the logic that picks one page."
    concepts:
      shared: [address-lines, chip-organization, pages-and-offsets, page-ranges, chip-select]
      m68k: [m68k-memory-map]
      z80: [z80-memory-map]
